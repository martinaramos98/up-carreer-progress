name: Backend Deployment
on: 
  workflow_run:
    workflows: ["Tests Backend"]
    types: [completed]
    branches: 
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-*"
jobs:
  on-failure:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    steps:
      - run: echo 'The triggering workflow failed'

  push_docker: 
    name: Push Docker Image
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Extract version
        uses: docker/metadata-action@v4
        id: meta
        with: 
          images: |
            ${{ secrets.DOCKER_USERNAME }}/up-progress-backend
          tags: |
            type=raw,value=latest
            type=raw,value=1.0.0
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=FastAPI Backend Service for Grade Progress from ${{ github.repository }}
            org.opencontainers.image.licenses=MIT
        
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./backend 
          file: ./backend/Dockerfile.main 
          push: true
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
      - name: Create GitHub Release
        uses: ctions/github-script@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const tagName = "${{ steps.version.outputs.tags }}";
            const releaseName = `Release ${tagName}`;
            const body = `
              Automatic release ${{ steps.version.outputs.description }}
              **Docker Images:**
              - \`${{ secrets.DOCKER_USERNAME }}/up-progress-backend:${tagName}\`
              - \`ghcr.io/${{ github.repository }}:${tagName}\`
            `;
            const response = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tagName,
              name: releaseName,
              body: body,
              draft: false,
              prerelease: false,
            });
            console.log(`Release created: ${response.data.html_url}`);  
      - name: Deploy render
        if: github.ref=='refs/heads/main'
        env:
          deploy_url: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl "$deploy_url"